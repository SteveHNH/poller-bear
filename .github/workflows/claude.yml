name: Claude Code

# Authenticates to the Claude API via Workload Identity Federation (WIF) by
# exchanging the workflow's GitHub OIDC token for a short-lived Anthropic
# access token — no CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY secret needed.
# One-time Console setup (issuer, service account, federation rule):
# https://platform.claude.com/docs/en/manage-claude/workload-identity-federation

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write # Required: used to fetch the GitHub OIDC token for the federation exchange
      actions: read # Required for Claude to read CI results on PRs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          # These values are identifiers, not secrets — they can live directly
          # in the workflow file or in repository variables.
          anthropic_federation_rule_id: fdrl_017JypvgZyWLQvBDgXsAJ5ng
          anthropic_organization_id: 408a9012-dcda-4ae0-8544-81aa6812d4b2
          anthropic_service_account_id: svac_0137NaWAVKdQy9cX6zwGY4Qp
          anthropic_workspace_id: wrkspc_01NMaEnPPnDpcS59veT9MJYk

          # This is an optional setting that allows Claude to read CI results on PRs
          additional_permissions: |
            actions: read

          # Optional: Customize the trigger phrase (default: @claude)
          # trigger_phrase: "/claude"

          # Optional: Trigger when specific user is assigned to an issue
          # assignee_trigger: "claude-bot"

          # Optional: Configure Claude's behavior with CLI arguments
          # claude_args: |
          #   --model claude-opus-4-1-20250805
          #   --max-turns 10
          #   --allowedTools "Bash(npm install),Bash(npm run build),Bash(npm run test:*),Bash(npm run lint:*)"
          #   --append-system-prompt "Follow our coding standards. Ensure all new code has tests. Use TypeScript for new files."

          # Optional: Advanced settings configuration
          # settings: |
          #   {
          #     "env": {
          #       "NODE_ENV": "test"
          #     }
          #   }
